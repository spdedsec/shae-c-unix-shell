name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y libreadline-dev
      - name: Build
        run: make build
      - name: Create release
        run: |
          make release
          gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "SHAE C Unix Shell" dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
